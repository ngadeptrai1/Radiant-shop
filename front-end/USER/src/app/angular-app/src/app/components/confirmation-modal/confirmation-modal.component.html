<div class="modal fade" id="confirmationModal" tabindex="-1" role="dialog" aria-labelledby="confirmationModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmationModalLabel">Xác nhận đặt hàng</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancel()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p>Bạn có chắc chắn muốn đặt hàng không?</p>
        <p>Vui lòng kiểm tra lại thông tin đơn hàng trước khi xác nhận.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Hủy</button>
        <button type="button" class="btn btn-primary" (click)="confirm()">Xác nhận</button>
      </div>
    </div>
  </div>
</div>
